version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicepilot-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SAMPLE_RATE=16000
      - VAD_THRESHOLD=0.5
      - MOCK_MODE=true
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: voicepilot-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped
